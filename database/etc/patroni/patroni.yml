scope: zabbix-ha
namespace: /service

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576

    postgresql:
      use_pg_rewind: true
      use_slots: true

      parameters:
        shared_preload_libraries: 'timescaledb'
        listen_addresses: '*'
        max_connections: 200
        hot_standby: "on"
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 trust
    - host replication replicator 127.0.0.1/32 scram-sha-256
    - host replication replicator 172.16.0.0/12 scram-sha-256
    - host all all 172.16.0.0/12 scram-sha-256
    - host replication replicator 192.168.20.0/24 scram-sha-256
    - host zabbix zabbix 192.168.20.0/24 scram-sha-256
    - host all all 192.168.20.0/24 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432

  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 trust
    - host replication replicator 127.0.0.1/32 scram-sha-256
    - host replication replicator 172.16.0.0/12 scram-sha-256
    - host all all 172.16.0.0/12 scram-sha-256
    - host replication replicator 192.168.20.0/24 scram-sha-256
    - host zabbix zabbix 192.168.20.0/24 scram-sha-256
    - host all all 192.168.20.0/24 scram-sha-256

  data_dir: /home/postgres/pgdata/data
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /home/postgres/.pgpass

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
